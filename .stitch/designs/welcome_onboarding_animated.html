<style data-purpose="custom-elements">
    /* Precise illustration container with subtle fade into lower section */
    .hero-img-mask {
      mask-image: linear-gradient(to bottom, black 82%, transparent 98%);
      -webkit-mask-image: linear-gradient(to bottom, black 82%, transparent 98%);

    /* Curved bottom notch indicator style */
    .home-indicator {
      width: 134px;
      height: 5px;
      background-color: #1c1c1e;
      border-radius: 9999px;
    }

    /* Motion & Keyframes */
    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes heroScaleIn {
      from {
        opacity: 0;
        transform: scale(0.96) translateY(8px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    @keyframes gentleFloat {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-5px);
      }
    }

    @keyframes softPulseGlow {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(207, 199, 186, 0.35);
      }
      50% {
        box-shadow: 0 0 12px 2px rgba(94, 130, 104, 0.15);
      }
    }

    @keyframes shimmerSweep {
      0% {
        transform: translateX(-150%) skewX(-20deg);
      }
      35%, 100% {
        transform: translateX(250%) skewX(-20deg);
      }
    }

    /* Animation utility classes */
    .anim-fade-in-down {
      opacity: 0;
      animation: fadeInDown 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.1s;
    }

    .anim-hero-entrance {
      opacity: 0;
      animation: heroScaleIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.2s;
    }

    .anim-float-ambient {
      animation: gentleFloat 6s ease-in-out infinite;
    }

    .anim-pill-glow {
      animation: softPulseGlow 4s ease-in-out infinite;
    }

    .anim-headline {
      opacity: 0;
      animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.35s;
    }

    .anim-prop-1 {
      opacity: 0;
      animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.5s;
    }

    .anim-prop-2 {
      opacity: 0;
      animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.6s;
    }

    .anim-prop-3 {
      opacity: 0;
      animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.7s;
    }

    .anim-bottom {
      opacity: 0;
      animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.8s;
    }

    .shimmer-effect::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 45%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.28), transparent);
      animation: shimmerSweep 4.5s ease-in-out infinite;
      pointer-events: none;
    }

    /* Accessibility: Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        opacity: 1 !important;
        transform: none !important;
      }
    }
  </style>
