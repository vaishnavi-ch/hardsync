<!-- BEGIN: Custom Tailwind Configuration -->
<script>

      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'Inter', 'Segoe UI', 'Roboto', 'sans-serif'],
          },
          colors: {
            'call-hangup': '#D9654C',

          animation: {
            'wave-bar-1': 'waveform 0.9s ease-in-out infinite alternate',

            'wave-bar-3': 'waveform 0.8s ease-in-out infinite alternate 0.3s',

            'wave-bar-5': 'waveform 0.75s ease-in-out infinite alternate 0.4s',

          keyframes: {
            waveform: {

<!-- END: Custom Tailwind Configuration -->

</div>
</div>
<!-- AI Roleplay Badge -->
<div class="glass-header-badge px-3.5 py-1.5 rounded-full flex items-center space-x-1.5 text-xs font-semibold tracking-tight shadow-sm">

<!-- Dynamic Animated Sound Waveform Indicator -->
<div aria-hidden="true" class="flex items-center space-x-[2.5px] h-4 w-4 justify-center">
<span class="w-[2px] bg-[#A2D9B3] rounded-full animate-wave-bar-1" style="height: 6px;"></span>
<span class="w-[2px] bg-[#A2D9B3] rounded-full animate-wave-bar-2" style="height: 12px;"></span>

</footer>

</div>
<!-- END: Main Mobile Viewport Frame -->
<!-- BEGIN: Client Interactivity Script -->
<script data-purpose="button-interactions">
    document.addEventListener('DOMContentLoaded', () => {
      const muteBtn = document.getElementById('mute-button');
      const pauseBtn = document.getElementById('pause-button');
      const endBtn = document.getElementById('end-button');
      
      let isMuted = false;
      let isPaused = false;

      // Handle Mute Click Toggle
      muteBtn?.addEventListener('click', () => {
        isMuted = !isMuted;
        if (isMuted) {
          muteBtn.classList.remove('bg-white', 'text-neutral-900');
          muteBtn.classList.add('bg-neutral-800', 'text-red-400');
        } else {
          muteBtn.classList.remove('bg-neutral-800', 'text-red-400');
          muteBtn.classList.add('bg-white', 'text-neutral-900');
        }
      });

      // Handle Pause Click Toggle
      pauseBtn?.addEventListener('click', () => {
        isPaused = !isPaused;
        if (isPaused) {
          pauseBtn.classList.remove('bg-white', 'text-neutral-900');
          pauseBtn.classList.add('bg-amber-100', 'text-amber-800');
        } else {
          pauseBtn.classList.remove('bg-amber-100', 'text-amber-800');
          pauseBtn.classList.add('bg-white', 'text-neutral-900');
        }
      });

      // Handle End Call Animation Feedback
      endBtn?.addEventListener('click', () => {
        endBtn.classList.add('scale-75', 'opacity-50');
        setTimeout(() => {
          endBtn.classList.remove('scale-75', 'opacity-50');
        }, 300);
      });
    });
  </script>
<!-- END: Client Interactivity Script -->


</body></html>
