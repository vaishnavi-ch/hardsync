<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    html,body{margin:0;background:#faf8f4;color:#1b1730;font:14px system-ui;height:100%;overflow:hidden}
    #avatarStage{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#fff 0,#f4efff 56%,#eee8ff 100%)}
    #avatarIllustration{width:min(92vw,82vh);height:min(92vw,82vh);object-fit:contain;filter:drop-shadow(0 18px 30px #39236122);animation:float 3.2s ease-in-out infinite;transition:filter .25s,transform .25s}
    #avatar{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#1d2434;display:none}
    #local{position:absolute;right:16px;bottom:16px;width:38%;max-width:220px;aspect-ratio:3/4;object-fit:cover;background:#1d2434;border-radius:18px;border:2px solid #fff;box-shadow:0 8px 28px #25193b33;touch-action:none;cursor:grab}
    #status{position:absolute;top:16px;left:16px;padding:8px 12px;border-radius:999px;background:#fff;color:#4b4270;box-shadow:0 2px 12px #25193b12}
    body.assistant-speaking #avatarIllustration{filter:drop-shadow(0 20px 36px #8059e555);transform:scale(1.025)}
    body.assistant-speaking #avatarStage:after{content:"";position:absolute;width:min(68vw,60vh);height:min(68vw,60vh);border:2px solid #8964ef66;border-radius:50%;animation:pulse 1.4s ease-out infinite;pointer-events:none}
    @keyframes float{0%,100%{translate:0 0}50%{translate:0 -8px}}
    @keyframes pulse{0%{scale:.9;opacity:.6}100%{scale:1.17;opacity:0}}
    #join{position:absolute;inset:0;margin:auto;width:190px;height:48px;border:0;border-radius:24px;background:#6c63ff;color:#fff;font-weight:700}
    #join[hidden]{display:none}
  </style>
</head>
<body>
  <div id="avatarStage"><img id="avatarIllustration" alt="HardSync AI call companion"><video id="avatar" playsinline muted></video></div>
  <video id="local" autoplay muted playsinline></video>
  <span id="status">Connecting to your rehearsal…</span>
  <button id="join" hidden>Start audio call</button>
  <script src="live_call.js"></script>
</body>
</html>
