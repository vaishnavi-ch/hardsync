<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  <meta name="permissions-policy" content="interest-cohort=(), microphone=*, camera=*">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="HardSync">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>HardSync</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://reqwhdhkpazfvvefvsnv.supabase.co" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <style>
    html, body { margin: 0; height: 100%; background: #faf8f4; }
    #app-loading {
      position: fixed; inset: 0; display: grid; place-items: center;
      color: #17182b; font: 600 18px system-ui, -apple-system, sans-serif;
    }
    #app-loading::before {
      content: ''; position: absolute; width: 46px; height: 46px;
      border: 3px solid #e2d8ff; border-top-color: #7c5ce7;
      border-radius: 50%; animation: spin .75s linear infinite;
    }
    #app-loading span { margin-top: 88px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app-loading" role="status" aria-label="Loading HardSync"><span>HardSync</span></div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Retire the legacy offline worker without delaying Flutter startup. Cache
    // cleanup is intentionally best-effort and never forces a reload loop.
    (async () => {
      if ('serviceWorker' in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        for (const registration of registrations) await registration.unregister();
        if ('caches' in window) {
          for (const key of await caches.keys()) {
            if (['flutter-app-cache', 'flutter-temp-cache', 'flutter-app-manifest'].includes(key)) await caches.delete(key);
          }
        }
      }
    })();
  </script>
</body>
</html>
